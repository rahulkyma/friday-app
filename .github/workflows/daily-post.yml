name: Daily Instagram Post

on:
  schedule:
    - cron: '0 9 * * *'  # Runs at 9 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create image directory
        run: mkdir -p images
      
      - name: Download image (example)
        run: |
          # Replace with your actual image source/URL
          echo "Image download step"
      
      - name: Run daily post automation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_PAGE_ID: ${{ secrets.INSTAGRAM_PAGE_ID }}
          CONTENT_NICHE: ${{ secrets.CONTENT_NICHE }}
          CONTENT_LANGUAGE: ${{ secrets.CONTENT_LANGUAGE }}
          CONTENT_TONE: ${{ secrets.CONTENT_TONE }}
          LOG_LEVEL: INFO
        run: |
          python -c "
          from main import InstagramAutomation
          automation = InstagramAutomation()
          if automation.validate_setup():
              # Post example - uncomment and configure
              # automation.post_with_ai_content('images/daily_post.jpg')
              print('Daily post automation ready')
          "
      
      - name: Log completion
        if: success()
        run: echo "Daily post completed successfully at $(date)"
      
      - name: Notify on failure
        if: failure()
        run: echo "Daily post failed - check logs for details"
